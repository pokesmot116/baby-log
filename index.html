<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baby Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baby Tracker">
<meta name="theme-color" content="#EEF1F6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1F6;
    --bg-card: #FFFFFF;
    --ink: #232A3B;
    --ink-soft: #6B7284;
    --line: #DDE2EC;
    --feed: #E39A3C;
    --feed-soft: #FBEBD3;
    --pee: #E8C24B;
    --pee-soft: #FBF3D6;
    --poop: #8A6A46;
    --poop-soft: #EAE0D2;
    --sleep: #6C7BB0;
    --sleep-soft: #E3E6F3;
    --good: #5B8C6E;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;}
  .pull-indicator{
    position:fixed; top:0; left:0; right:0; text-align:center; padding:14px 0 10px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); background:var(--bg);
    transform:translateY(-100%); transition:transform .15s ease; z-index:100;
  }
  .pull-indicator.visible{transform:translateY(0);}
  .pull-indicator.ready{color:var(--good);}
  .wrap{max-width:520px; margin:0 auto; padding:20px 16px 60px;}

  header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0; letter-spacing:-0.01em;}
  .sync-dot{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .sync-dot span.led{width:7px; height:7px; border-radius:50%; background:var(--good); display:inline-block; transition:opacity .3s;}

  .next-feed-card{
    background:var(--feed-soft); border:1px solid #EFD4A6; border-radius:var(--radius);
    padding:14px 16px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .next-feed-card.overdue{background:#FBE2DC; border-color:#EFB5A6;}
  .next-feed-card.active{background:var(--feed-soft); border-color:#EFD4A6;}
  .next-feed-card .nf-label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600;}
  .next-feed-card .nf-value{font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-top:2px;}
  .next-feed-card .nf-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .next-feed-card .nf-interval{
    font-size:12px; color:var(--ink-soft); background:rgba(255,255,255,0.6); border:none;
    padding:6px 10px; border-radius:20px; cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif; font-weight:600;
  }
  .interval-edit{display:flex; align-items:center; gap:6px;}
  .interval-edit input{width:48px; font-family:'Inter',sans-serif; font-size:13px; padding:6px 8px; border-radius:8px; border:1px solid var(--line);}
  .interval-edit button{border:none; background:var(--feed); color:#fff; font-weight:600; font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer;}

  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px;}
  .stat{background:var(--bg-card); border-radius:var(--radius); padding:12px 10px; border:1px solid var(--line);}
  .stat .label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600;}
  .stat .value{font-family:'Fraunces',serif; font-size:17px; margin-top:4px; font-weight:500; white-space:nowrap;}
  .stat .sub{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}

  .feed-btn{
    width:100%; border:none; border-radius:var(--radius); padding:22px 18px;
    background:var(--feed); color:#fff; font-family:'Fraunces',serif; font-size:20px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; cursor:pointer;
    box-shadow:0 4px 14px rgba(227,154,60,0.25); transition:transform .08s ease;
  }
  .feed-btn:active{transform:scale(0.98);}
  .feed-btn.active{background:#C97A1E;}
  .feed-btn.sleep-btn{background:var(--sleep); box-shadow:0 4px 14px rgba(108,123,176,0.25);}
  .feed-btn.sleep-btn.active{background:#4E5D8F;}
  .feed-btn .pulse{width:10px;height:10px;border-radius:50%;background:#fff; animation:pulse 1.4s infinite ease-in-out;}
  .feed-btn.active .pulse{display:block;} .feed-btn:not(.active) .pulse{display:none;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.35; transform:scale(1.4);}}
  .feed-timer{font-variant-numeric:tabular-nums; font-family:'Inter',sans-serif; font-weight:600; font-size:15px; opacity:.9;}

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}

  .active-timer-edit{margin:-4px 0 12px; font-size:12.5px; color:var(--ink-soft); text-align:center;}
  .active-timer-edit .adjust-link{background:none; border:none; color:var(--sleep); font-weight:600; font-size:12.5px; cursor:pointer; text-decoration:underline; padding:2px 4px;}
  .active-timer-edit .adjust-form{
    display:flex; align-items:center; justify-content:center; gap:8px; background:var(--bg-card);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:2px;
  }
  .active-timer-edit .adjust-form input{font-family:'Inter',sans-serif; font-size:13px; padding:6px 8px; border-radius:8px; border:1px solid var(--line);}
  .active-timer-edit .adjust-form button{border:none; border-radius:8px; padding:6px 12px; font-weight:600; font-size:12.5px; cursor:pointer;}
  .active-timer-edit .adjust-save{background:var(--good); color:#fff;}
  .active-timer-edit .adjust-cancel{background:var(--line); color:var(--ink);}
  .diaper-btn{
    border:none; border-radius:var(--radius); padding:18px 10px; font-family:'Fraunces',serif; font-size:18px; font-weight:600;
    color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; transition:transform .08s ease;
  }
  .diaper-btn:active{transform:scale(0.97);}
  .diaper-btn.pee{background:var(--pee-soft); border:1px solid #EFDA92;}
  .diaper-btn.poop{background:var(--poop-soft); border:1px solid #D3BF9F;}
  .diaper-btn .icon{font-size:26px;}
  .diaper-btn .hint{font-family:'Inter',sans-serif; font-size:11px; font-weight:500; color:var(--ink-soft);}

  .timeline-wrap{margin-bottom:22px;}
  .section-label{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; margin:0 0 8px 2px;}
  .timeline{display:flex; gap:6px; overflow-x:auto; padding:10px 2px; background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--line);}
  .tdot{flex:0 0 auto; width:10px; height:10px; border-radius:50%; margin-top:4px;}
  .tdot.feed{background:var(--feed);} .tdot.pee{background:var(--pee);} .tdot.poop{background:var(--poop);} .tdot.sleep{background:var(--sleep);}
  .timeline-empty{padding:14px; color:var(--ink-soft); font-size:13px;}

  .log-day{margin-bottom:6px;}

  .view-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .toggle-btn{
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft); font-family:'Inter',sans-serif;
    font-size:13px; font-weight:600; padding:8px 14px; border-radius:10px; cursor:pointer;
  }
  .toggle-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .toggle-btn.export{margin-left:auto; color:var(--good); border-color:var(--good);}

  .table-wrap{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto;}
  table.log-table{width:100%; border-collapse:collapse; font-size:13.5px; white-space:nowrap;}
  table.log-table th{
    text-align:left; padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg-card);
  }
  table.log-table td{padding:10px 12px; border-bottom:1px solid var(--line);}
  table.log-table tr:last-child td{border-bottom:none;}
  table.log-table .type-feed{color:var(--feed); font-weight:600;}
  table.log-table .type-sleep{color:var(--sleep); font-weight:600;}
  table.log-table .type-pee{color:#B08F1E; font-weight:600;}
  table.log-table .type-poop{color:var(--poop); font-weight:600;}
  .log-day-label{font-size:13px; font-weight:600; color:var(--ink-soft); margin:18px 2px 8px;}
  .entry{
    display:flex; align-items:center; gap:12px; background:var(--bg-card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-bottom:8px;
  }
  .entry .badge{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto;}
  .entry .badge.feed{background:var(--feed-soft);} .entry .badge.pee{background:var(--pee-soft);} .entry .badge.poop{background:var(--poop-soft);} .entry .badge.sleep{background:var(--sleep-soft);}
  .entry .meta{flex:1; min-width:0;}
  .entry .meta .type{font-weight:600; font-size:14.5px;}
  .entry .meta .time{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .entry .del{border:none; background:transparent; color:var(--ink-soft); font-size:18px; cursor:pointer; padding:6px;}
  .entry .del:active{color:#C0392B;}
  .entry .edit{border:none; background:transparent; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:6px;}
  .entry .edit:active{color:var(--ink);}

  .entry-editing{flex-direction:column; align-items:stretch;}
  .edit-form{width:100%; display:flex; flex-direction:column; gap:10px;}
  .edit-form label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); font-weight:600;}
  .edit-form input[type="datetime-local"]{
    font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); color:var(--ink);
  }
  .edit-actions{display:flex; gap:8px; margin-top:2px;}
  .edit-actions button{flex:1; border:none; border-radius:10px; padding:9px; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer;}
  .edit-save{background:var(--good); color:#fff;}
  .edit-cancel{background:var(--line); color:var(--ink);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}
  footer{text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:26px; line-height:1.5;}

  .tag-panel{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:22px;}
  .tag-panel .tag-title{font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:10px;}
  .tag-chips{display:flex; gap:8px; flex-wrap:wrap;}
  .tag-chip{
    border:1px solid var(--line); background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    font-size:13.5px; font-weight:600; padding:9px 14px; border-radius:20px; cursor:pointer;
  }
  .tag-chip:active{background:var(--feed-soft); border-color:var(--feed);}
  .tag-chip.skip{margin-left:auto; color:var(--ink-soft); border:none; background:transparent; font-weight:500;}
  .tag-amount-row{display:flex; gap:8px; align-items:center; margin-top:10px;}
  .tag-amount-row input{flex:1; font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line);}
  .tag-amount-row button{border:none; background:var(--feed); color:#fff; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 16px; border-radius:12px; font-size:13.5px;
    display:flex; align-items:center; gap:14px; opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.2); max-width:90vw; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  .toast button{border:none; background:transparent; color:#8FB3F0; font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;}

  .entry .note{font-size:12px; color:var(--ink-soft); margin-top:2px; font-style:italic;}
  .entry .feed-detail{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .edit-form textarea{font-family:'Inter',sans-serif; font-size:13.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); resize:vertical; min-height:44px;}
  .edit-form select{font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); color:var(--ink); background:#fff;}

  .summary-day{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .summary-day .summary-date{font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin-bottom:8px;}
  .summary-row{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0; border-top:1px solid var(--line);}
  .summary-row:first-of-type{border-top:none;}
  .summary-row .label{color:var(--ink-soft);}
  .summary-row .val{font-weight:600; display:flex; align-items:center; gap:6px;}
  .summary-day.milestone{background:var(--feed-soft); border-color:#EFD4A6;}
  .side-bar{height:8px; border-radius:4px; background:var(--sleep-soft); overflow:hidden; margin:2px 0 8px;}
  .side-bar-left{height:100%; background:var(--feed);}
  .delta{font-size:11px; font-weight:700; padding:1px 6px; border-radius:8px;}
  .delta.up{color:#8A5A1E; background:#F3DCB4;}
  .delta.down{color:#3D6B4F; background:#D5E8DC;}
  .delta.flat{color:var(--ink-soft); background:var(--line);}
</style>
</head>
<body>
<div id="pullIndicator" class="pull-indicator">↓ Pull to refresh</div>
<div class="wrap">
  <header>
    <h1>Baby Tracker</h1>
    <div class="sync-dot"><span class="led" id="syncLed"></span><span id="syncText">synced</span></div>
  </header>

  <div class="next-feed-card" id="nextFeedCard"></div>

  <div class="stats">
    <div class="stat">
      <div class="label">Last feeding</div>
      <div class="value" id="lastFeedVal">—</div>
      <div class="sub" id="lastFeedSub">no entries yet</div>
    </div>
    <div class="stat">
      <div class="label">Last diaper</div>
      <div class="value" id="lastDiaperVal">—</div>
      <div class="sub" id="lastDiaperSub">no entries yet</div>
    </div>
    <div class="stat">
      <div class="label">Last sleep</div>
      <div class="value" id="lastSleepVal">—</div>
      <div class="sub" id="lastSleepSub">no entries yet</div>
    </div>
  </div>

  <button class="feed-btn" id="feedBtn">
    <span id="feedBtnLabel">Start feeding</span>
    <span style="display:flex; align-items:center; gap:8px;">
      <span class="feed-timer" id="feedTimer"></span>
      <span class="pulse"></span>
    </span>
  </button>
  <div id="feedStartEdit" class="active-timer-edit" style="display:none;"></div>

  <button class="feed-btn sleep-btn" id="sleepBtn">
    <span id="sleepBtnLabel">Start sleep</span>
    <span style="display:flex; align-items:center; gap:8px;">
      <span class="feed-timer" id="sleepTimer"></span>
      <span class="pulse"></span>
    </span>
  </button>
  <div id="sleepStartEdit" class="active-timer-edit" style="display:none;"></div>

  <div id="tagPanel" style="display:none;"></div>

  <div class="row2">
    <button class="diaper-btn pee" id="peeBtn"><span class="icon">💛</span>Pee<span class="hint">log now</span></button>
    <button class="diaper-btn poop" id="poopBtn"><span class="icon">🟤</span>Poop<span class="hint">log now</span></button>
  </div>

  <div class="timeline-wrap">
    <div class="section-label">Today's rhythm</div>
    <div class="timeline" id="timeline"><div class="timeline-empty">Nothing logged today yet</div></div>
  </div>

  <div class="view-toggle">
    <button class="toggle-btn active" id="listViewBtn">List</button>
    <button class="toggle-btn" id="tableViewBtn">Table</button>
    <button class="toggle-btn" id="summaryViewBtn">Summary</button>
    <button class="toggle-btn export" id="exportBtn">Export CSV</button>
  </div>

  <div id="log"></div>
  <div id="tableView" style="display:none;"></div>
  <div id="summaryView" style="display:none;"></div>

  <footer>Shared with both parents — updates sync automatically every few seconds.</footer>
</div>

<div id="toast" class="toast"></div>

<script type="module">
// ====== FIREBASE CONFIG — paste your project config here ======
const firebaseConfig = {
  apiKey: "AIzaSyBuUmg5yVpZMWeuyHMwjNe65igN3zs8e18",
  authDomain: "peepeepoopoo-269f2.firebaseapp.com",
  projectId: "peepeepoopoo-269f2",
  storageBucket: "peepeepoopoo-269f2.firebasestorage.app",
  messagingSenderId: "967956533795",
  appId: "1:967956533795:web:4fc7d3ac40756546179796"
};
// =================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const eventsDocRef = doc(db, "babyLog", "events");
const activeFeedDocRef = doc(db, "babyLog", "activeFeed");
const activeSleepDocRef = doc(db, "babyLog", "activeSleep");
const settingsDocRef = doc(db, "babyLog", "settings");

let events = [];
let activeFeedStart = null;
let feedTimerInterval = null;
let activeSleepStart = null;
let sleepTimerInterval = null;
let tagPromptId = null;
let feedIntervalHours = 3;
let editingInterval = false;
let editingActiveTimer = null; // null | 'feed' | 'sleep'
let toastTimeout = null;

function isTimedEvent(type){ return type === 'feed' || type === 'sleep'; }
function eventTime(e){ return isTimedEvent(e.type) ? e.start : e.time; }

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function fmtDateLabel(iso){
  const d = new Date(iso);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  if(d.toDateString() === today.toDateString()) return 'Today';
  if(d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'});
}
function ago(iso){
  const ms = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(ms/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins/60);
  const remMins = mins % 60;
  return hrs + 'h ' + remMins + 'm ago';
}
function fmtMsDuration(ms){
  const mins = Math.round(ms/60000);
  if(mins < 1) return '<1 min';
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), m = mins%60;
  return h + 'h ' + m + 'm';
}
function durationStr(startIso, endIso){
  return fmtMsDuration(new Date(endIso) - new Date(startIso));
}
// Splits a [start,end) interval into daytime (7am-7pm) vs nighttime
// milliseconds, correctly handling sessions that cross the boundary
// or run past midnight.
function splitDayNight(start, end){
  let day = 0, night = 0;
  let cursor = new Date(start);
  const stop = new Date(end);
  let guard = 0;
  while(cursor < stop && guard < 100){
    guard++;
    const y = cursor.getFullYear(), m = cursor.getMonth(), d = cursor.getDate();
    const dayStart = new Date(y, m, d, 7, 0, 0);
    const dayEnd = new Date(y, m, d, 19, 0, 0);
    let segEnd;
    if(cursor < dayStart){
      segEnd = new Date(Math.min(dayStart.getTime(), stop.getTime()));
      night += segEnd - cursor;
    } else if(cursor < dayEnd){
      segEnd = new Date(Math.min(dayEnd.getTime(), stop.getTime()));
      day += segEnd - cursor;
    } else {
      const nextDayStart = new Date(y, m, d+1, 7, 0, 0);
      segEnd = new Date(Math.min(nextDayStart.getTime(), stop.getTime()));
      night += segEnd - cursor;
    }
    cursor = segEnd;
  }
  return { day, night };
}

async function saveEvents(){
  try{
    await setDoc(eventsDocRef, { list: events });
    flashSync(true);
  }catch(e){ flashSync(false); console.error(e); }
}
async function saveActiveFeed(){
  try{
    if(activeFeedStart){
      await setDoc(activeFeedDocRef, { start: activeFeedStart });
    } else {
      await deleteDoc(activeFeedDocRef);
    }
    flashSync(true);
  }catch(e){ flashSync(false); console.error(e); }
}
async function saveActiveSleep(){
  try{
    if(activeSleepStart){
      await setDoc(activeSleepDocRef, { start: activeSleepStart });
    } else {
      await deleteDoc(activeSleepDocRef);
    }
    flashSync(true);
  }catch(e){ flashSync(false); console.error(e); }
}
async function saveSettings(){
  try{
    await setDoc(settingsDocRef, { feedIntervalHours });
    flashSync(true);
  }catch(e){ flashSync(false); console.error(e); }
}
function flashSync(ok){
  const led = document.getElementById('syncLed');
  const text = document.getElementById('syncText');
  led.style.background = ok ? '#5B8C6E' : '#C0392B';
  text.textContent = ok ? 'synced' : 'sync issue';
}

function updateFeedButton(){
  const btn = document.getElementById('feedBtn');
  const label = document.getElementById('feedBtnLabel');
  const timer = document.getElementById('feedTimer');
  if(activeFeedStart){
    btn.classList.add('active');
    label.textContent = 'End feeding';
    if(!feedTimerInterval){
      feedTimerInterval = setInterval(()=>{
        const ms = Date.now() - new Date(activeFeedStart).getTime();
        const mins = Math.floor(ms/60000);
        const secs = Math.floor((ms%60000)/1000);
        timer.textContent = mins + ':' + String(secs).padStart(2,'0');
      }, 1000);
    }
  } else {
    btn.classList.remove('active');
    label.textContent = 'Start feeding';
    timer.textContent = '';
    if(feedTimerInterval){ clearInterval(feedTimerInterval); feedTimerInterval = null; }
  }
}

function updateSleepButton(){
  const btn = document.getElementById('sleepBtn');
  const label = document.getElementById('sleepBtnLabel');
  const timer = document.getElementById('sleepTimer');
  if(activeSleepStart){
    btn.classList.add('active');
    label.textContent = 'End sleep';
    if(!sleepTimerInterval){
      sleepTimerInterval = setInterval(()=>{
        const ms = Date.now() - new Date(activeSleepStart).getTime();
        const totalSecs = Math.floor(ms/1000);
        const hrs = Math.floor(totalSecs/3600);
        const mins = Math.floor((totalSecs%3600)/60);
        const secs = totalSecs%60;
        timer.textContent = hrs > 0
          ? hrs + ':' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0')
          : mins + ':' + String(secs).padStart(2,'0');
      }, 1000);
    }
  } else {
    btn.classList.remove('active');
    label.textContent = 'Start sleep';
    timer.textContent = '';
    if(sleepTimerInterval){ clearInterval(sleepTimerInterval); sleepTimerInterval = null; }
  }
}

const activeTimerEditRendered = { feed: false, sleep: false };
function renderActiveTimerEdit(kind){
  const isFeed = kind === 'feed';
  const activeStart = isFeed ? activeFeedStart : activeSleepStart;
  const container = document.getElementById(isFeed ? 'feedStartEdit' : 'sleepStartEdit');
  const editing = editingActiveTimer === kind;

  if(!activeStart){
    container.style.display = 'none';
    container.innerHTML = '';
    activeTimerEditRendered[kind] = false;
    if(editing) editingActiveTimer = null;
    return;
  }

  if(editing && activeTimerEditRendered[kind]) return; // form already open — don't wipe unsaved typing
  activeTimerEditRendered[kind] = editing;

  container.style.display = '';
  if(editing){
    container.innerHTML = `<div class="adjust-form">
      <input type="datetime-local" id="adjustInput-${kind}" value="${toLocalInputValue(activeStart)}">
      <button class="adjust-save" data-kind="${kind}">Save</button>
      <button class="adjust-cancel" data-kind="${kind}">Cancel</button>
    </div>`;
    document.querySelector(`.adjust-save[data-kind="${kind}"]`).addEventListener('click', async ()=>{
      const val = document.getElementById('adjustInput-'+kind).value;
      if(val){
        const newStart = fromLocalInputValue(val);
        if(isFeed){ activeFeedStart = newStart; await saveActiveFeed(); }
        else { activeSleepStart = newStart; await saveActiveSleep(); }
      }
      editingActiveTimer = null;
      renderAll();
    });
    document.querySelector(`.adjust-cancel[data-kind="${kind}"]`).addEventListener('click', ()=>{
      editingActiveTimer = null;
      renderAll();
    });
  } else {
    container.innerHTML = `Started at ${fmtTime(activeStart)} · <button class="adjust-link" data-kind="${kind}">forgot to start it? adjust</button>`;
    container.querySelector('.adjust-link').addEventListener('click', ()=>{
      editingActiveTimer = kind;
      renderAll();
    });
  }
}

function fmtCountdown(ms){
  const mins = Math.round(Math.abs(ms)/60000);
  const h = Math.floor(mins/60);
  const m = mins%60;
  return (h>0 ? h+'h ' : '') + m+'m';
}

let lastIntervalEditState = false;
function renderNextFeedCard(){
  const card = document.getElementById('nextFeedCard');
  if(editingInterval && lastIntervalEditState) return; // editor already open — don't wipe unsaved typing
  lastIntervalEditState = editingInterval;
  if(editingInterval){
    card.className = 'next-feed-card active';
    card.innerHTML = `<div style="width:100%;">
      <div class="nf-label">Feeding reminder interval</div>
      <div class="interval-edit" style="margin-top:8px;">
        <input type="number" min="1" max="12" step="0.5" id="intervalInput" value="${feedIntervalHours}">
        <span style="font-size:12px; color:var(--ink-soft);">hours</span>
        <button id="intervalSave">Save</button>
      </div>
    </div>`;
    document.getElementById('intervalSave').addEventListener('click', async ()=>{
      const val = parseFloat(document.getElementById('intervalInput').value);
      if(val && val > 0) feedIntervalHours = val;
      editingInterval = false;
      await saveSettings();
      renderAll();
    });
    return;
  }

  const intervalControl = `<button class="nf-interval" id="editIntervalBtn">every ${feedIntervalHours}h ✎</button>`;

  if(activeFeedStart){
    card.className = 'next-feed-card active';
    card.innerHTML = `<div><div class="nf-label">Feeding now</div><div class="nf-value">In progress</div></div>${intervalControl}`;
  } else {
    const feeds = events.filter(e=>e.type==='feed').sort((a,b)=> new Date(b.start)-new Date(a.start));
    if(!feeds.length){
      card.className = 'next-feed-card';
      card.innerHTML = `<div><div class="nf-label">Next feeding</div><div class="nf-value">Log a feed to start predicting</div></div>${intervalControl}`;
    } else {
      const lastStart = new Date(feeds[0].start);
      const predicted = new Date(lastStart.getTime() + feedIntervalHours*3600000);
      const diff = predicted - Date.now();
      const overdue = diff < 0;
      card.className = 'next-feed-card' + (overdue ? ' overdue' : '');
      card.innerHTML = `<div>
        <div class="nf-label">${overdue ? 'Feeding overdue' : 'Next feeding'}</div>
        <div class="nf-value">${fmtTime(predicted.toISOString())}</div>
        <div class="nf-sub">${overdue ? 'overdue by ' + fmtCountdown(diff) : 'in ' + fmtCountdown(diff)}</div>
      </div>${intervalControl}`;
    }
  }
  const editBtn = document.getElementById('editIntervalBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{ editingInterval = true; renderNextFeedCard(); });
}

  const diapers = events.filter(e=>e.type==='pee'||e.type==='poop').sort((a,b)=>new Date(b.time)-new Date(a.time));

function renderTimeline(){
  const today = new Date().toDateString();
  const todays = events.filter(e=>{
    const t = e.type==='feed' ? e.start : e.time;
    return new Date(t).toDateString() === today;
  }).sort((a,b)=> new Date(eventTime(a)) - new Date(eventTime(b)));

let editingId = null;
let lastEditRenderId = null;

function toLocalInputValue(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalInputValue(str){
  return new Date(str).toISOString();
}

function renderLog(){
  const logEl = document.getElementById('log');
  if(editingId !== null){
    if(lastEditRenderId === editingId) return; // form already open — don't wipe unsaved typing
    lastEditRenderId = editingId;
  } else {
    lastEditRenderId = null;
  }
  if(!events.length){
    logEl.innerHTML = '<div class="empty-state"><div class="big">🍼</div>Nothing logged yet.<br>Tap a button above to start.</div>';
    return;
  }
  const sorted = [...events].sort((a,b)=>{
    const ta = new Date(eventTime(a));
    const tb = new Date(eventTime(b));
    return tb - ta;
  });
  const groups = {};
  sorted.forEach(e=>{
    const t = eventTime(e);
    const dayKey = new Date(t).toDateString();
    if(!groups[dayKey]) groups[dayKey] = [];
    groups[dayKey].push(e);
  });
  let html = '';
  Object.keys(groups).forEach(dayKey=>{
    const items = groups[dayKey];
    html += `<div class="log-day-label">${fmtDateLabel(eventTime(items[0]))}</div>`;
    items.forEach(e=>{
      if(editingId === e.id){
        html += renderEditForm(e);
        return;
      }
      let icon, typeLabel, timeLabel;
      if(e.type==='feed'){
        icon = '🍼'; typeLabel = 'Feeding';
        timeLabel = fmtTime(e.start) + (e.end ? ' – ' + fmtTime(e.end) + ' · ' + durationStr(e.start, e.end) : ' · in progress');
      } else if(e.type==='sleep'){
        icon = '😴'; typeLabel = 'Sleep';
        timeLabel = fmtTime(e.start) + (e.end ? ' – ' + fmtTime(e.end) + ' · ' + durationStr(e.start, e.end) : ' · in progress');
      } else if(e.type==='pee'){
        icon = '💛'; typeLabel = 'Pee'; timeLabel = fmtTime(e.time);
      } else {
        icon = '🟤'; typeLabel = 'Poop'; timeLabel = fmtTime(e.time);
      }
      html += `<div class="entry">
        <div class="badge ${e.type}">${icon}</div>
        <div class="meta">
          <div class="type">${typeLabel}</div>
          <div class="time">${timeLabel}</div>
          ${e.type==='feed' && e.side ? `<div class="feed-detail">${e.side}${e.side==='Bottle' && e.amount ? ' · ' + e.amount + 'oz' : ''}</div>` : ''}
          ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ''}
        </div>
        <button class="edit" data-id="${e.id}" aria-label="Edit entry">✎</button>
        <button class="del" data-id="${e.id}" aria-label="Delete entry">✕</button>
      </div>`;
    });
  });
  logEl.innerHTML = html;

  logEl.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      events = events.filter(e=>e.id !== id);
      await saveEvents();
      renderAll();
    });
  });
  logEl.querySelectorAll('.edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingId = btn.getAttribute('data-id');
      renderAll();
    });
  });
  logEl.querySelectorAll('.edit-cancel').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingId = null;
      renderAll();
    });
  });
  logEl.querySelectorAll('.edit-save').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      const ev = events.find(x=>x.id === id);
      if(!ev) return;
      if(isTimedEvent(ev.type)){
        const startVal = document.getElementById('editStart-'+id).value;
        const endVal = document.getElementById('editEnd-'+id).value;
        if(startVal) ev.start = fromLocalInputValue(startVal);
        ev.end = endVal ? fromLocalInputValue(endVal) : null;
      } else {
        const timeVal = document.getElementById('editTime-'+id).value;
        if(timeVal) ev.time = fromLocalInputValue(timeVal);
      }
      if(ev.type === 'feed'){
        const sideEl = document.getElementById('editSide-'+id);
        const amountEl = document.getElementById('editAmount-'+id);
        const sideVal = sideEl ? sideEl.value : '';
        ev.side = sideVal || null;
        ev.amount = (sideVal === 'Bottle' && amountEl && amountEl.value) ? parseFloat(amountEl.value) : null;
      }
      const noteEl = document.getElementById('editNote-'+id);
      ev.note = (noteEl && noteEl.value.trim()) ? noteEl.value.trim() : null;
      editingId = null;
      await saveEvents();
      renderAll();
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderTable(){
  const tableEl = document.getElementById('tableView');
  if(!events.length){
    tableEl.innerHTML = '<div class="empty-state"><div class="big">📋</div>Nothing to show yet.</div>';
    return;
  }
  const sorted = [...events].sort((a,b)=>{
    const ta = new Date(eventTime(a));
    const tb = new Date(eventTime(b));
    return tb - ta;
  });
  let rows = sorted.map(e=>{
    const t = eventTime(e);
    const dateStr = new Date(t).toLocaleDateString([], {month:'short', day:'numeric'});
    const timeStr = fmtTime(t);
    const typeLabel = e.type==='feed' ? 'Feeding' : (e.type==='sleep' ? 'Sleep' : (e.type==='pee' ? 'Pee' : 'Poop'));
    const durationCol = isTimedEvent(e.type) ? (e.end ? durationStr(e.start, e.end) : 'in progress') : '—';
    const detailBits = [];
    if(e.type==='feed' && e.side) detailBits.push(e.side + (e.side==='Bottle' && e.amount ? ' ' + e.amount + 'oz' : ''));
    if(e.note) detailBits.push(e.note);
    const detailCol = detailBits.length ? escapeHtml(detailBits.join(' · ')) : '—';
    return `<tr>
      <td>${dateStr}</td>
      <td>${timeStr}</td>
      <td class="type-${e.type}">${typeLabel}</td>
      <td>${durationCol}</td>
      <td>${detailCol}</td>
    </tr>`;
  }).join('');
  tableEl.innerHTML = `<div class="table-wrap"><table class="log-table">
    <thead><tr><th>Date</th><th>Time</th><th>Type</th><th>Duration</th><th>Details</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderSummary(){
  const summaryEl = document.getElementById('summaryView');
  if(!events.length){
    summaryEl.innerHTML = '<div class="empty-state"><div class="big">📊</div>Nothing to summarize yet.</div>';
    return;
  }
  const groups = {};
  events.forEach(e=>{
    const dayKey = new Date(eventTime(e)).toDateString();
    if(!groups[dayKey]) groups[dayKey] = [];
    groups[dayKey].push(e);
  });
  const dayKeys = Object.keys(groups).sort((a,b)=> new Date(b) - new Date(a));

  // ---- Milestone: longest sleep stretch ever ----
  const completedSleeps = events.filter(e=>e.type==='sleep' && e.end);
  let milestonesHtml = '';
  if(completedSleeps.length){
    const longest = completedSleeps.reduce((best,s)=>{
      const ms = new Date(s.end) - new Date(s.start);
      return ms > best.ms ? {ms, s} : best;
    }, {ms:0, s:null});
    milestonesHtml += `<div class="summary-day milestone">
      <div class="summary-date">🏆 Longest sleep stretch</div>
      <div class="summary-row" style="border-top:none;"><span class="label">${fmtDateLabel(longest.s.start)}, ${fmtTime(longest.s.start)}</span><span class="val">${fmtMsDuration(longest.ms)}</span></div>
    </div>`;
  }

  // ---- Milestone: feed side balance (breastfeeding only, Left/Right entries) ----
  const sidedFeeds = events.filter(e=>e.type==='feed' && e.end && (e.side==='Left' || e.side==='Right'));
  if(sidedFeeds.length){
    let leftMs = 0, rightMs = 0;
    sidedFeeds.forEach(f=>{
      const ms = new Date(f.end) - new Date(f.start);
      if(f.side==='Left') leftMs += ms; else rightMs += ms;
    });
    const totalMs = leftMs + rightMs;
    const leftPct = Math.round((leftMs/totalMs)*100);
    milestonesHtml += `<div class="summary-day milestone">
      <div class="summary-date">⚖️ Feed side balance</div>
      <div class="side-bar"><div class="side-bar-left" style="width:${leftPct}%;"></div></div>
      <div class="summary-row" style="border-top:none;"><span class="label">Left · ${fmtMsDuration(leftMs)}</span><span class="val">Right · ${fmtMsDuration(rightMs)}</span></div>
    </div>`;
  }

  // ---- Today vs. yesterday ----
  const todayKey = new Date().toDateString();
  const yestKey = new Date(Date.now() - 86400000).toDateString();
  const todayItems = groups[todayKey] || [];
  const yestItems = groups[yestKey] || [];
  function tally(items){
    const feeds = items.filter(e=>e.type==='feed').length;
    const sleepMs = items.filter(e=>e.type==='sleep' && e.end).reduce((sum,s)=> sum + (new Date(s.end)-new Date(s.start)), 0);
    const diapers = items.filter(e=>e.type==='pee'||e.type==='poop').length;
    return { feeds, sleepMs, diapers };
  }
  function deltaArrow(diff){
    if(diff > 0) return `<span class="delta up">▲${diff}</span>`;
    if(diff < 0) return `<span class="delta down">▼${Math.abs(diff)}</span>`;
    return `<span class="delta flat">—</span>`;
  }
  function deltaArrowDuration(diffMs){
    const rounded = Math.round(diffMs/60000)*60000; // round to nearest minute
    if(rounded === 0) return `<span class="delta flat">—</span>`;
    const label = fmtMsDuration(Math.abs(rounded));
    return rounded > 0
      ? `<span class="delta up">▲${label}</span>`
      : `<span class="delta down">▼${label}</span>`;
  }
  if(todayItems.length || yestItems.length){
    const t = tally(todayItems), y = tally(yestItems);
    milestonesHtml += `<div class="summary-day milestone">
      <div class="summary-date">📈 Today vs. yesterday</div>
      <div class="summary-row" style="border-top:none;"><span class="label">🍼 Feeds</span><span class="val">${t.feeds} ${deltaArrow(t.feeds - y.feeds)}</span></div>
      <div class="summary-row"><span class="label">😴 Sleep</span><span class="val">${fmtMsDuration(t.sleepMs)} ${deltaArrowDuration(t.sleepMs-y.sleepMs)}</span></div>
      <div class="summary-row"><span class="label">💧 Diapers</span><span class="val">${t.diapers} ${deltaArrow(t.diapers - y.diapers)}</span></div>
    </div>`;
  }

  let html = milestonesHtml;
  dayKeys.forEach(dayKey=>{
    const items = groups[dayKey];
    const feeds = items.filter(e=>e.type==='feed');
    const sleeps = items.filter(e=>e.type==='sleep');
    const pees = items.filter(e=>e.type==='pee').length;
    const poops = items.filter(e=>e.type==='poop').length;

    const feedCount = feeds.length;
    const bottleOz = feeds.filter(f=>f.side==='Bottle' && f.amount).reduce((sum,f)=>sum+f.amount, 0);
    let feedDetail = feedCount + (feedCount===1 ? ' feed' : ' feeds');
    if(bottleOz > 0) feedDetail += ' · ' + bottleOz + 'oz bottle total';

    const totalSleepMs = sleeps.reduce((sum,s)=> s.end ? sum + (new Date(s.end)-new Date(s.start)) : sum, 0);
    let sleepDetail = 'none logged';
    if(sleeps.length){
      sleepDetail = fmtMsDuration(totalSleepMs) + ' total (' + sleeps.length + (sleeps.length===1?' session':' sessions') + ')';
    }
    const split = sleeps.filter(s=>s.end).reduce((acc,s)=>{
      const d = splitDayNight(s.start, s.end);
      acc.day += d.day; acc.night += d.night;
      return acc;
    }, {day:0, night:0});
    const splitDetail = (split.day+split.night) > 0
      ? `☀️ ${fmtMsDuration(split.day)} · 🌙 ${fmtMsDuration(split.night)}`
      : null;

    html += `<div class="summary-day">
      <div class="summary-date">${fmtDateLabel(dayKey)}</div>
      <div class="summary-row" style="border-top:none;"><span class="label">🍼 Feeding</span><span class="val">${feedDetail}</span></div>
      <div class="summary-row"><span class="label">😴 Sleep</span><span class="val">${sleepDetail}</span></div>
      ${splitDetail ? `<div class="summary-row"><span class="label">Day / night</span><span class="val">${splitDetail}</span></div>` : ''}
      <div class="summary-row"><span class="label">💛 Pee</span><span class="val">${pees}</span></div>
      <div class="summary-row"><span class="label">🟤 Poop</span><span class="val">${poops}</span></div>
    </div>`;
  });
  summaryEl.innerHTML = html;
}

function exportCSV(){
  const sorted = [...events].sort((a,b)=>{
    const ta = new Date(eventTime(a));
    const tb = new Date(eventTime(b));
    return ta - tb;
  });
  const csvEscape = s => '"' + String(s).replace(/"/g,'""') + '"';
  let csv = 'Date,Time,Type,Duration,Side,Amount (oz),Note\n';
  sorted.forEach(e=>{
    const t = eventTime(e);
    const dateStr = new Date(t).toLocaleDateString();
    const timeStr = fmtTime(t);
    const typeLabel = e.type==='feed' ? 'Feeding' : (e.type==='sleep' ? 'Sleep' : (e.type==='pee' ? 'Pee' : 'Poop'));
    const durationCol = isTimedEvent(e.type) ? (e.end ? durationStr(e.start, e.end) : 'in progress') : '';
    const sideCol = e.type==='feed' && e.side ? e.side : '';
    const amountCol = e.type==='feed' && e.side==='Bottle' && e.amount != null ? e.amount : '';
    const noteCol = e.note || '';
    csv += [dateStr, timeStr, typeLabel, durationCol, sideCol, amountCol, csvEscape(noteCol)].join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'baby-log-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function showToast(message, undoId){
  const toast = document.getElementById('toast');
  toast.innerHTML = `<span>${message}</span><button id="toastUndo">Undo</button>`;
  toast.classList.add('show');
  document.getElementById('toastUndo').addEventListener('click', async ()=>{
    events = events.filter(e=>e.id !== undoId);
    if(tagPromptId === undoId) tagPromptId = null;
    await saveEvents();
    hideToast();
    renderAll();
  });
  if(toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(hideToast, 6000);
}
function hideToast(){
  document.getElementById('toast').classList.remove('show');
}

let lastTagRenderId;
function renderTagPanel(){
  const panel = document.getElementById('tagPanel');
  if(tagPromptId === lastTagRenderId) return; // nothing changed — don't wipe an in-progress bottle amount
  lastTagRenderId = tagPromptId;
  if(!tagPromptId){ panel.style.display = 'none'; panel.innerHTML=''; return; }
  const ev = events.find(e=>e.id === tagPromptId);
  if(!ev){ tagPromptId = null; panel.style.display = 'none'; return; }
  panel.style.display = '';
  panel.innerHTML = `<div class="tag-panel">
    <div class="tag-title">Tag that feed</div>
    <div class="tag-chips">
      <button class="tag-chip" data-side="Left">Left</button>
      <button class="tag-chip" data-side="Right">Right</button>
      <button class="tag-chip" data-side="Both">Both</button>
      <button class="tag-chip" data-side="Bottle">Bottle</button>
      <button class="tag-chip skip" id="tagSkip">Skip</button>
    </div>
    <div class="tag-amount-row" id="tagAmountRow" style="display:none;">
      <input type="number" min="0" step="0.5" id="tagAmountInput" placeholder="oz">
      <button id="tagAmountSave">Save</button>
    </div>
  </div>`;
  panel.querySelectorAll('.tag-chip[data-side]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const side = btn.getAttribute('data-side');
      if(side === 'Bottle'){
        document.getElementById('tagAmountRow').style.display = 'flex';
        return;
      }
      ev.side = side;
      tagPromptId = null;
      await saveEvents();
      renderAll();
    });
  });
  document.getElementById('tagSkip').addEventListener('click', ()=>{
    tagPromptId = null;
    renderAll();
  });
  const amountSaveBtn = document.getElementById('tagAmountSave');
  if(amountSaveBtn){
    amountSaveBtn.addEventListener('click', async ()=>{
      const val = document.getElementById('tagAmountInput').value;
      ev.side = 'Bottle';
      if(val) ev.amount = parseFloat(val);
      tagPromptId = null;
      await saveEvents();
      renderAll();
    });
  }
}

// Pull-to-refresh — reloads the page, which re-establishes the Firestore
// connection. Useful since Safari on iOS often suspends the realtime
// listener when the tab has been backgrounded for a while.
// Takes over the touch gesture directly (preventDefault) instead of
// watching scroll position, since iOS Safari's own elastic bounce at the
// top of the page otherwise swallows the gesture before JS sees it clearly.
(function setupPullToRefresh(){
  const indicator = document.getElementById('pullIndicator');
  const wrap = document.querySelector('.wrap');
  const THRESHOLD = 70;
  const MAX_PULL = 110;
  let startY = null;
  let dragging = false;
  let ready = false;

  function atTop(){
    return (document.scrollingElement || document.documentElement).scrollTop <= 0;
  }

  document.addEventListener('touchstart', (e)=>{
    if(atTop()){
      startY = e.touches[0].clientY;
      dragging = true;
      ready = false;
    } else {
      startY = null;
      dragging = false;
    }
  }, {passive:true});

  document.addEventListener('touchmove', (e)=>{
    if(!dragging || startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0){ return; }
    if(!atTop()){ dragging = false; return; }
    // We're actively pulling down from the top — take over the gesture
    // so the native elastic bounce doesn't compete with our indicator.
    e.preventDefault();
    const pull = Math.min(dy * 0.5, MAX_PULL);
    wrap.style.transition = 'none';
    wrap.style.transform = `translateY(${pull}px)`;
    indicator.classList.add('visible');
    ready = dy > THRESHOLD;
    indicator.classList.toggle('ready', ready);
    indicator.textContent = ready ? '↑ Release to refresh' : '↓ Pull to refresh';
  }, {passive:false});

  document.addEventListener('touchend', ()=>{
    if(!dragging) return;
    dragging = false;
    wrap.style.transition = 'transform .2s ease';
    wrap.style.transform = 'translateY(0)';
    if(ready){
      indicator.textContent = 'Refreshing…';
      setTimeout(()=> location.reload(), 150);
    } else {
      indicator.classList.remove('visible', 'ready');
    }
    startY = null;
  }, {passive:true});
})();
