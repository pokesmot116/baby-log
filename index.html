<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feed & Diaper Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1F6;
    --bg-card: #FFFFFF;
    --ink: #232A3B;
    --ink-soft: #6B7284;
    --line: #DDE2EC;
    --feed: #E39A3C;
    --feed-soft: #FBEBD3;
    --pee: #E8C24B;
    --pee-soft: #FBF3D6;
    --poop: #8A6A46;
    --poop-soft: #EAE0D2;
    --good: #5B8C6E;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh;}
  .wrap{max-width:520px; margin:0 auto; padding:20px 16px 60px;}

  header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0; letter-spacing:-0.01em;}
  .sync-dot{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .sync-dot span.led{width:7px; height:7px; border-radius:50%; background:var(--good); display:inline-block; transition:opacity .3s;}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .stat{background:var(--bg-card); border-radius:var(--radius); padding:14px 16px; border:1px solid var(--line);}
  .stat .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600;}
  .stat .value{font-family:'Fraunces',serif; font-size:22px; margin-top:4px; font-weight:500;}
  .stat .sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  .feed-btn{
    width:100%; border:none; border-radius:var(--radius); padding:22px 18px;
    background:var(--feed); color:#fff; font-family:'Fraunces',serif; font-size:20px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; cursor:pointer;
    box-shadow:0 4px 14px rgba(227,154,60,0.25); transition:transform .08s ease;
  }
  .feed-btn:active{transform:scale(0.98);}
  .feed-btn.active{background:#C97A1E;}
  .feed-btn .pulse{width:10px;height:10px;border-radius:50%;background:#fff; animation:pulse 1.4s infinite ease-in-out;}
  .feed-btn.active .pulse{display:block;} .feed-btn:not(.active) .pulse{display:none;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.35; transform:scale(1.4);}}
  .feed-timer{font-variant-numeric:tabular-nums; font-family:'Inter',sans-serif; font-weight:600; font-size:15px; opacity:.9;}

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .diaper-btn{
    border:none; border-radius:var(--radius); padding:18px 10px; font-family:'Fraunces',serif; font-size:18px; font-weight:600;
    color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; transition:transform .08s ease;
  }
  .diaper-btn:active{transform:scale(0.97);}
  .diaper-btn.pee{background:var(--pee-soft); border:1px solid #EFDA92;}
  .diaper-btn.poop{background:var(--poop-soft); border:1px solid #D3BF9F;}
  .diaper-btn .icon{font-size:26px;}
  .diaper-btn .hint{font-family:'Inter',sans-serif; font-size:11px; font-weight:500; color:var(--ink-soft);}

  .timeline-wrap{margin-bottom:22px;}
  .section-label{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; margin:0 0 8px 2px;}
  .timeline{display:flex; gap:6px; overflow-x:auto; padding:10px 2px; background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--line);}
  .tdot{flex:0 0 auto; width:10px; height:10px; border-radius:50%; margin-top:4px;}
  .tdot.feed{background:var(--feed);} .tdot.pee{background:var(--pee);} .tdot.poop{background:var(--poop);}
  .timeline-empty{padding:14px; color:var(--ink-soft); font-size:13px;}

  .log-day{margin-bottom:6px;}
  .log-day-label{font-size:13px; font-weight:600; color:var(--ink-soft); margin:18px 2px 8px;}
  .entry{
    display:flex; align-items:center; gap:12px; background:var(--bg-card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-bottom:8px;
  }
  .entry .badge{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto;}
  .entry .badge.feed{background:var(--feed-soft);} .entry .badge.pee{background:var(--pee-soft);} .entry .badge.poop{background:var(--poop-soft);}
  .entry .meta{flex:1; min-width:0;}
  .entry .meta .type{font-weight:600; font-size:14.5px;}
  .entry .meta .time{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .entry .del{border:none; background:transparent; color:var(--ink-soft); font-size:18px; cursor:pointer; padding:6px;}
  .entry .del:active{color:#C0392B;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}
  footer{text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:26px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Feed &amp; Diaper Log</h1>
    <div class="sync-dot"><span class="led" id="syncLed"></span><span id="syncText">synced</span></div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="label">Last feeding</div>
      <div class="value" id="lastFeedVal">—</div>
      <div class="sub" id="lastFeedSub">no entries yet</div>
    </div>
    <div class="stat">
      <div class="label">Last diaper</div>
      <div class="value" id="lastDiaperVal">—</div>
      <div class="sub" id="lastDiaperSub">no entries yet</div>
    </div>
  </div>

  <button class="feed-btn" id="feedBtn">
    <span id="feedBtnLabel">Start feeding</span>
    <span style="display:flex; align-items:center; gap:8px;">
      <span class="feed-timer" id="feedTimer"></span>
      <span class="pulse"></span>
    </span>
  </button>

  <div class="row2">
    <button class="diaper-btn pee" id="peeBtn"><span class="icon">💛</span>Pee<span class="hint">log now</span></button>
    <button class="diaper-btn poop" id="poopBtn"><span class="icon">🟤</span>Poop<span class="hint">log now</span></button>
  </div>

  <div class="timeline-wrap">
    <div class="section-label">Today's rhythm</div>
    <div class="timeline" id="timeline"><div class="timeline-empty">Nothing logged today yet</div></div>
  </div>

  <div id="log"></div>

  <footer>Shared with both parents — updates sync automatically every few seconds.</footer>
</div>

<script type="module">
// ====== FIREBASE CONFIG — paste your project config here ======
const firebaseConfig = {
  apiKey: "AIzaSyBuUmg5yVpZMWeuyHMwjNe65igN3zs8e18",
  authDomain: "peepeepoopoo-269f2.firebaseapp.com",
  projectId: "peepeepoopoo-269f2",
  storageBucket: "peepeepoopoo-269f2.firebasestorage.app",
  messagingSenderId: "967956533795",
  appId: "1:967956533795:web:4fc7d3ac40756546179796"
};
// =================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const eventsDocRef = doc(db, "babyLog", "events");
const activeFeedDocRef = doc(db, "babyLog", "activeFeed");

let events = [];
let activeFeedStart = null;
let feedTimerInterval = null;

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function fmtDateLabel(iso){
  const d = new Date(iso);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  if(d.toDateString() === today.toDateString()) return 'Today';
  if(d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'});
}
function ago(iso){
  const ms = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(ms/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins/60);
  const remMins = mins % 60;
  return hrs + 'h ' + remMins + 'm ago';
}
function durationStr(startIso, endIso){
  const ms = new Date(endIso) - new Date(startIso);
  const mins = Math.round(ms/60000);
  if(mins < 1) return '<1 min';
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), m = mins%60;
  return h + 'h ' + m + 'm';
}

async function saveEvents(){
  try{
    await setDoc(eventsDocRef, { list: events });
    flashSync(true);
  }catch(e){ flashSync(false); console.error(e); }
}
async function saveActiveFeed(){
  try{
    if(activeFeedStart){
      await setDoc(activeFeedDocRef, { start: activeFeedStart });
    } else {
      await deleteDoc(activeFeedDocRef);
    }
    flashSync(true);
  }catch(e){ flashSync(false); console.error(e); }
}
function flashSync(ok){
  const led = document.getElementById('syncLed');
  const text = document.getElementById('syncText');
  led.style.background = ok ? '#5B8C6E' : '#C0392B';
  text.textContent = ok ? 'synced' : 'sync issue';
}

function updateFeedButton(){
  const btn = document.getElementById('feedBtn');
  const label = document.getElementById('feedBtnLabel');
  const timer = document.getElementById('feedTimer');
  if(activeFeedStart){
    btn.classList.add('active');
    label.textContent = 'End feeding';
    if(!feedTimerInterval){
      feedTimerInterval = setInterval(()=>{
        const ms = Date.now() - new Date(activeFeedStart).getTime();
        const mins = Math.floor(ms/60000);
        const secs = Math.floor((ms%60000)/1000);
        timer.textContent = mins + ':' + String(secs).padStart(2,'0');
      }, 1000);
    }
  } else {
    btn.classList.remove('active');
    label.textContent = 'Start feeding';
    timer.textContent = '';
    if(feedTimerInterval){ clearInterval(feedTimerInterval); feedTimerInterval = null; }
  }
}

function updateStats(){
  const feeds = events.filter(e=>e.type==='feed').sort((a,b)=>new Date(b.start)-new Date(a.start));
  const diapers = events.filter(e=>e.type==='pee'||e.type==='poop').sort((a,b)=>new Date(b.time)-new Date(a.time));
  const lastFeedVal = document.getElementById('lastFeedVal');
  const lastFeedSub = document.getElementById('lastFeedSub');
  const lastDiaperVal = document.getElementById('lastDiaperVal');
  const lastDiaperSub = document.getElementById('lastDiaperSub');
  if(feeds.length){
    lastFeedVal.textContent = ago(feeds[0].start);
    lastFeedSub.textContent = fmtTime(feeds[0].start) + (feeds[0].end ? ' · ' + durationStr(feeds[0].start, feeds[0].end) : '');
  } else {
    lastFeedVal.textContent = '—'; lastFeedSub.textContent = 'no entries yet';
  }
  if(diapers.length){
    lastDiaperVal.textContent = ago(diapers[0].time);
    lastDiaperSub.textContent = fmtTime(diapers[0].time) + ' · ' + (diapers[0].type==='pee' ? 'pee' : 'poop');
  } else {
    lastDiaperVal.textContent = '—'; lastDiaperSub.textContent = 'no entries yet';
  }
}

function renderTimeline(){
  const today = new Date().toDateString();
  const todays = events.filter(e=>{
    const t = e.type==='feed' ? e.start : e.time;
    return new Date(t).toDateString() === today;
  }).sort((a,b)=> new Date(a.type==='feed'?a.start:a.time) - new Date(b.type==='feed'?b.start:b.time));
  const el = document.getElementById('timeline');
  if(!todays.length){ el.innerHTML = '<div class="timeline-empty">Nothing logged today yet</div>'; return; }
  el.innerHTML = todays.map(e=>`<span class="tdot ${e.type}" title="${e.type} ${fmtTime(e.type==='feed'?e.start:e.time)}"></span>`).join('');
}

function renderLog(){
  const logEl = document.getElementById('log');
  if(!events.length){
    logEl.innerHTML = '<div class="empty-state"><div class="big">🍼</div>Nothing logged yet.<br>Tap a button above to start.</div>';
    return;
  }
  const sorted = [...events].sort((a,b)=>{
    const ta = new Date(a.type==='feed'?a.start:a.time);
    const tb = new Date(b.type==='feed'?b.start:b.time);
    return tb - ta;
  });
  const groups = {};
  sorted.forEach(e=>{
    const t = e.type==='feed'?e.start:e.time;
    const dayKey = new Date(t).toDateString();
    if(!groups[dayKey]) groups[dayKey] = [];
    groups[dayKey].push(e);
  });
  let html = '';
  Object.keys(groups).forEach(dayKey=>{
    const items = groups[dayKey];
    html += `<div class="log-day-label">${fmtDateLabel(items[0].type==='feed'?items[0].start:items[0].time)}</div>`;
    items.forEach(e=>{
      let icon, typeLabel, timeLabel;
      if(e.type==='feed'){
        icon = '🍼'; typeLabel = 'Feeding';
        timeLabel = fmtTime(e.start) + (e.end ? ' – ' + fmtTime(e.end) + ' · ' + durationStr(e.start, e.end) : ' · in progress');
      } else if(e.type==='pee'){
        icon = '💛'; typeLabel = 'Pee'; timeLabel = fmtTime(e.time);
      } else {
        icon = '🟤'; typeLabel = 'Poop'; timeLabel = fmtTime(e.time);
      }
      html += `<div class="entry">
        <div class="badge ${e.type}">${icon}</div>
        <div class="meta"><div class="type">${typeLabel}</div><div class="time">${timeLabel}</div></div>
        <button class="del" data-id="${e.id}" aria-label="Delete entry">✕</button>
      </div>`;
    });
  });
  logEl.innerHTML = html;
  logEl.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      events = events.filter(e=>e.id !== id);
      await saveEvents();
      renderAll();
    });
  });
}

function renderAll(){
  updateFeedButton();
  updateStats();
  renderTimeline();
  renderLog();
}

document.getElementById('feedBtn').addEventListener('click', async ()=>{
  if(activeFeedStart){
    events.push({ id: 'e'+Date.now(), type:'feed', start: activeFeedStart, end: new Date().toISOString() });
    activeFeedStart = null;
    await saveEvents();
    await saveActiveFeed();
  } else {
    activeFeedStart = new Date().toISOString();
    await saveActiveFeed();
  }
  renderAll();
});

document.getElementById('peeBtn').addEventListener('click', async ()=>{
  events.push({ id:'e'+Date.now(), type:'pee', time: new Date().toISOString() });
  await saveEvents();
  renderAll();
});
document.getElementById('poopBtn').addEventListener('click', async ()=>{
  events.push({ id:'e'+Date.now(), type:'poop', time: new Date().toISOString() });
  await saveEvents();
  renderAll();
});

// Realtime listeners — updates from either phone appear within ~1 second, no polling needed
onSnapshot(eventsDocRef, (snap)=>{
  events = snap.exists() && snap.data().list ? snap.data().list : [];
  renderAll();
  flashSync(true);
}, (err)=>{ console.error(err); flashSync(false); });

onSnapshot(activeFeedDocRef, (snap)=>{
  activeFeedStart = snap.exists() ? snap.data().start : null;
  renderAll();
}, (err)=>{ console.error(err); flashSync(false); });

</script>
</body>
</html>
